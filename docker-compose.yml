version: '3.8'

services:
  ad-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad-analytics-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
